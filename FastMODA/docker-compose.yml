version: '3.8'

services:
  fastmoda:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
      args:
        - CUDA_VERSION=11.8
        - BUILD_TARGET=gpu
    ports:
      - "5000:5000"
    volumes:
      - ./uploads:/app/uploads
      - ./example_sigs:/app/example_sigs:ro
    environment:
      - FLASK_ENV=production
      - USE_GPU=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  uploads:

networks:
  default:
    name: fastmoda-network
