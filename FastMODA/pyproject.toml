[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmoda"
dynamic = ["version"]
description = "MODA's time-frequency, coherence, bispectrum, ridge and Bayesian coupling analyses in Python, with ports checked against MODA's MATLAB output"
# The PyPI page. README.md in this folder is about the web service and Docker.
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"   # the repository's LICENSE (GPL v3)
license-files = ["LICENSE"]   # a copy of the repository root's LICENSE
authors = [{ name = "Steve Mander" }]
keywords = [
    "MODA", "wavelet transform", "time-frequency analysis", "phase coherence",
    "bispectrum", "ridge extraction", "dynamical Bayesian inference",
    "surrogate testing", "changepoint detection", "biomedical signals",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# Only what `import fastmoda` and the MODA ports (fastmoda.legacy_moda,
# legacy_ridge, legacy_bayes) need. The web service and the accelerated
# paths are extras.
dependencies = [
    "numpy",
    "scipy",
    "ruptures",
]

[project.optional-dependencies]
# .mat v7.3 files (HDF5) in fastmoda.load_signal
mat73 = ["h5py"]
# condition classifiers (fastmoda.condition_models, pipeline, training script)
ml = ["scikit-learn", "joblib"]
# PyTorch paths (*_gpu modules); install torch from the PyTorch index for CUDA
gpu = ["torch>=2.0"]
# live capture (fastmoda.audio_capture)
audio = ["sounddevice"]
# what the Flask service in this folder (app.py) needs on top of the library
server = ["flask", "plotly>=6,<7", "gunicorn", "redis", "h5py", "matplotlib",
          "scikit-learn", "joblib"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/st7ma784/MODA"
Documentation = "https://st7ma784.github.io/MODA/api-and-ml/python-library/"
Source = "https://github.com/st7ma784/MODA/tree/main/FastMODA"
Issues = "https://github.com/st7ma784/MODA/issues"
"MODA (MATLAB original)" = "https://github.com/luphysics/MODA"

[project.scripts]
# Runs the web service locally (fastmoda.LocalServer); needs the server extra.
fastmoda-server = "fastmoda.web.server:main"

[tool.setuptools]
# The library plus the web service (fastmoda.web: the Flask app, its
# templates and static files), which LocalServer runs without Docker.
# The data folders are listed as packages too, as setuptools requires.
packages = ["fastmoda", "fastmoda.web", "fastmoda.web.templates",
            "fastmoda.web.static", "fastmoda.web.static.css", "fastmoda.web.static.images"]

[tool.setuptools.package-data]
"fastmoda.web.templates" = ["*.html"]
"fastmoda.web.static.css" = ["*.css"]
"fastmoda.web.static.images" = ["*.svg"]

[tool.setuptools.dynamic]
version = { attr = "fastmoda.__version__" }
