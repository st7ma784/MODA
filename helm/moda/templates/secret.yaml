{{- if .Values.fastmoda.enabled }}
{{- $secretName := printf "%s-auth" (include "moda.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $apiKey := "" }}
{{- if $existing }}
{{- $apiKey = index $existing.data "api-key" | b64dec }}
{{- else if .Values.auth.apiKey }}
{{- $apiKey = .Values.auth.apiKey }}
{{- else }}
{{- $apiKey = printf "moda_%s" (randAlphaNum 48) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "moda.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ $apiKey | quote }}
{{- end }}
