{{- if .Values.signal.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moda.fullname" . }}-signal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "moda.labels" . | nindent 4 }}
    app.kubernetes.io/component: signal
spec:
  replicas: {{ .Values.signal.replicaCount }}
  selector:
    matchLabels:
      {{- include "moda.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: signal
  template:
    metadata:
      labels:
        {{- include "moda.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: signal
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "moda.serviceAccountName" . }}
      containers:
        - name: signal
          image: "{{ .Values.signal.image.repository }}:{{ .Values.signal.image.tag }}"
          imagePullPolicy: {{ .Values.signal.image.pullPolicy }}
          args:
            - --port
            - {{ .Values.signal.service.port | quote }}
            - --fs
            - {{ .Values.signal.sampleRate | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.signal.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.signal.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
