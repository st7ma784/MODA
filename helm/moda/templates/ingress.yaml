{{- if .Values.ingress.enabled }}
{{- /*
  Resolve the cluster domain. Priority:
    1. Explicit host set in values (ingress.hosts[].host)
    2. "domain" label on the Rancher local cluster CRD (auto-detected)
  This avoids hardcoding the domain in fleet.yaml or values.yaml for
  GitOps deployments where the domain is stamped onto the cluster at
  provision time by labelRancherCluster().
*/}}
{{- $clusterDomain := "" }}
{{- $cluster := lookup "management.cattle.io/v3" "Cluster" "" "local" }}
{{- if and $cluster $cluster.metadata $cluster.metadata.labels }}
{{- $clusterDomain = index $cluster.metadata.labels "domain" | default "" }}
{{- end }}
{{- $defaultHost := "" }}
{{- if $clusterDomain }}
{{- $defaultHost = printf "moda.%s" $clusterDomain }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "moda.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "moda.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    {{- $host := .host | default $defaultHost }}
    - {{- if $host }}
      host: {{ $host | quote }}
      {{- end }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if eq .backend "fastmoda" }}
                name: {{ include "moda.fullname" $ }}-fastmoda
                port:
                  number: {{ $.Values.fastmoda.service.port }}
                {{- else if eq .backend "server" }}
                name: {{ include "moda.fullname" $ }}-server
                port:
                  number: {{ $.Values.server.service.port }}
                {{- else if eq .backend "mobile" }}
                name: {{ include "moda.fullname" $ }}-mobile
                port:
                  number: {{ $.Values.mobile.service.port }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
