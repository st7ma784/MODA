{{- if .Values.ingress.enabled }}
{{- /*
  Host resolution follows the ClusterOS guide:
    1. host    — explicit FQDN in values (wins)
    2. prefix  — subdomain prefix; FQDN becomes <prefix>.<clusterDomain>
                 where clusterDomain comes from ingress.domain override,
                 then ConfigMap kube-system/clusteros-config, then the
                 Rancher local Cluster CR `domain` label
    3. nip.io  — if no domain is available, <prefix>-<dashed-node-ip>.nip.io
    4. empty   — emit a rule with no host (path-based catch-all)
  Set `ingress.domain` in values.yaml only when you need to override the
  auto-detected cluster domain. Do not hard-code FQDNs in this chart.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "moda.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "moda.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
    app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    {{- $host := include "moda.host" (dict "ctx" $ "prefix" (.prefix | default "moda") "explicit" (.host | default "")) }}
    -
      {{- if $host }}
      host: {{ $host | quote }}
      {{- end }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                {{- if eq .backend "fastmoda" }}
                name: {{ include "moda.fullname" $ }}-fastmoda
                port:
                  number: {{ $.Values.fastmoda.service.port }}
                {{- else if eq .backend "server" }}
                name: {{ include "moda.fullname" $ }}-server
                port:
                  number: {{ $.Values.server.service.port }}
                {{- else if eq .backend "mobile" }}
                name: {{ include "moda.fullname" $ }}-mobile
                port:
                  number: {{ $.Values.mobile.service.port }}
                {{- else if eq .backend "emulator" }}
                name: {{ include "moda.fullname" $ }}-emulator
                port:
                  number: {{ $.Values.emulator.service.port }}
                {{- else if eq .backend "signal" }}
                name: {{ include "moda.fullname" $ }}-signal
                port:
                  number: {{ $.Values.signal.service.port }}
                {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
