{{- if .Values.fastmoda.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moda.fullname" . }}-fastmoda
  labels:
    {{- include "moda.labels" . | nindent 4 }}
    app.kubernetes.io/component: fastmoda
spec:
  {{- if not .Values.fastmoda.autoscaling.enabled }}
  replicas: {{ .Values.fastmoda.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "moda.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: fastmoda
  template:
    metadata:
      labels:
        {{- include "moda.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: fastmoda
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "moda.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: fastmoda
          image: "{{ .Values.fastmoda.image.repository }}:{{ .Values.fastmoda.image.tag }}"
          imagePullPolicy: {{ .Values.fastmoda.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.fastmoda.service.port }}
              protocol: TCP
          env:
            {{- range $key, $val := .Values.fastmoda.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.fastmoda.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.fastmoda.readinessProbe | nindent 12 }}
          {{- if .Values.fastmoda.gpu.enabled }}
          # GPU variant resource allocation
          resources:
            {{- toYaml .Values.fastmoda.gpu.resources | nindent 12 }}
          {{- else }}
          # CPU variant resource allocation
          resources:
            {{- toYaml .Values.fastmoda.resources | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.fastmoda.gpu.enabled }}
      # Node selector for GPU variant
      nodeSelector:
        {{- toYaml .Values.fastmoda.gpu.nodeSelector | nindent 8 }}
      {{- else }}
      {{- with .Values.nodeSelector }}
      # Node selector for general workloads
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

---
{{- if .Values.fastmoda.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "moda.fullname" . }}-fastmoda
  labels:
    {{- include "moda.labels" . | nindent 4 }}
    app.kubernetes.io/component: fastmoda
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "moda.fullname" . }}-fastmoda
  minReplicas: {{ .Values.fastmoda.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.fastmoda.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.fastmoda.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
