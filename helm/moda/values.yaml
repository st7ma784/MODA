# MODA Helm Chart — Production Values (Minimal)
# Rancher-optimized: reduced comment size for API request limits

imagePullSecrets: []
nameOverride: "moda"
fullnameOverride: ""

fastmoda:
  enabled: true
  image:
    repository: st7ma784/moda-fastmoda
    tag: latest-cpu
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 5000
    annotations: {}
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi
  env:
    FLASK_ENV: production
    FLASK_DEBUG: "false"
    PYTHONUNBUFFERED: "1"
    USE_GPU: "auto"
    GUNICORN_WORKERS: "2"
  gpu:
    enabled: false
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
        nvidia.com/gpu: "1"
    nodeSelector: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 45
    periodSeconds: 5
    timeoutSeconds: 5

server:
  enabled: false
  image:
    repository: st7ma784/moda-server
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 6789
    annotations: {}
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  env:
    MATLABPATH: /app:/app/allguis/codes:/app/allguis/guis
  matlab:
    licenseServer: ""
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi

mobile:
  enabled: false
  image:
    repository: st7ma784/moda-mobile-builder
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    kubernetes.io/ingress.class: nginx
    rancher.io/ingress: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  hosts:
    - host: ""
      paths:
        - path: /moda(/|$)(.*)
          pathType: ImplementationSpecific
          backend: fastmoda
  tls: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
