# MODA Helm Chart — Production Values
# Rancher-optimized

imagePullSecrets: []
nameOverride: "moda"
fullnameOverride: ""

auth:
  # Pre-shared API key consumed by the mobile app (baked into binary),
  # the FastMODA server (injected as FASTMODA_API_KEY), and the emulator
  # (injected as FASTMODA_API_KEY so it can proxy authenticated calls).
  # Leave empty to auto-generate a random key on first install (preserved
  # across upgrades via secret.yaml's lookup). Rotate: set explicitly,
  # rebuild the app, then `helm upgrade`.
  apiKey: ""

# ── FastMODA: analysis backend + full test UI (served on moda.<domain>) ────────
fastmoda:
  enabled: true
  image:
    repository: st7ma784/moda-fastmoda
    tag: latest-cpu
    pullPolicy: Always
  replicaCount: 1
  service:
    type: ClusterIP
    port: 5000
    annotations: {}
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi
  env:
    FLASK_ENV: production
    FLASK_DEBUG: "false"
    PYTHONUNBUFFERED: "1"
    USE_GPU: "auto"
    GUNICORN_WORKERS: "2"
    MODA_DATA_DIR: "/data"
    # Caps concurrent in-flight analyses per fastmoda process (see
    # fastmoda.concurrency.BoundedJobRunner) instead of an unbounded thread
    # per upload.
    MAX_CONCURRENT_JOBS: "4"
    # How long job-status entries and uploaded scratch files live before
    # being evicted/deleted (fastmoda.job_status, fastmoda.concurrency).
    JOB_STATUS_TTL: "3600"
    UPLOAD_TTL_SECONDS: "3600"
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi
  gpu:
    enabled: false
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 2Gi
        nvidia.com/gpu: "1"
    nodeSelector: {}
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 60
    periodSeconds: 15
    timeoutSeconds: 5
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 45
    periodSeconds: 5
    timeoutSeconds: 5

# ── Redis: shared job-status cache for FastMODA ────────────────────────────
# Required for correct /status/<task_id> polling once fastmoda.replicaCount > 1
# or fastmoda.autoscaling.enabled is true — without it, each fastmoda pod/
# worker only sees jobs it started itself. Safe to disable for a single-pod,
# single-worker deployment (FastMODA falls back to in-process status).
redis:
  enabled: true
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  service:
    port: 6379
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

# ── Signal generator: synthetic EEG/biomedical signal for the emulator ────────
# Cluster-internal only (no ingress exposure by default).
signal:
  enabled: true
  image:
    repository: st7ma784/moda-signal
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  sampleRate: "256"
  service:
    type: ClusterIP
    port: 8090
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

# ── Emulator: phone-frame UI that drives all 17 analyses (mobilemoda.<domain>) ─
emulator:
  enabled: true
  image:
    repository: st7ma784/moda-emulator
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── MODA Server: MATLAB runtime (opt-in; requires license) ─────────────────────
server:
  enabled: false
  image:
    repository: st7ma784/moda-server
    tag: latest
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 6789
    annotations: {}
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi
  env:
    MATLABPATH: /app:/app/allguis/codes:/app/allguis/guis
  matlab:
    licenseServer: ""
  persistence:
    enabled: true
    storageClass: ""
    accessMode: ReadWriteOnce
    size: 5Gi

# ── Flutter web mobile preview: separate from the emulator (opt-in) ────────────
# The emulator above is the user-facing test UI on mobilemoda.<domain>; this
# block builds & serves the actual Flutter web app instead. Leave disabled
# unless you want the real Flutter build at a separate host.
mobile:
  enabled: false
  image:
    repository: st7ma784/moda-mobile-builder
    tag: latest
    pullPolicy: Always
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

# ── Ingress ──────────────────────────────────────────────────────────────────
# Hosts auto-derive per the ClusterOS guide. Resolution order for each rule:
#   1. `host:` in this list                              (explicit FQDN — wins)
#   2. `<prefix>.<domain>` where `domain` comes from:
#         a. `ingress.domain` below                      (explicit override)
#         b. ConfigMap kube-system/clusteros-config      (ClusterOS canonical)
#         c. Rancher local Cluster CR `domain` label     (legacy fallback)
#   3. `<prefix>-<dashed-node-ip>.nip.io`                (no-domain fallback)
#   4. empty host                                        (path-based catch-all)
#
# Defaults below produce:
#   moda.<domain>        → FastMODA full test UI + API
#   mobilemoda.<domain>  → Emulator phone-frame UI
# Override per cluster by passing `--set ingress.domain=example.com` or by
# adding `host: my.fqdn` to a hosts[] entry.
ingress:
  enabled: true
  className: nginx
  # Explicit cluster-domain override. Leave empty to auto-detect.
  domain: ""
  annotations:
    kubernetes.io/ingress.class: nginx
    rancher.io/ingress: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
  hosts:
    - prefix: moda           # → moda.<domain> or moda-<ip>.nip.io
      paths:
        - path: /
          pathType: Prefix
          backend: fastmoda
    - prefix: mobilemoda     # → mobilemoda.<domain> or mobilemoda-<ip>.nip.io
      paths:
        - path: /
          pathType: Prefix
          backend: emulator
  tls: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
