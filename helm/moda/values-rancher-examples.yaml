# ============================================================
# Example 1: Rancher Local Cluster with Ingress
# (Default nginx-ingress controller)
# ============================================================
# Use this for Rancher local clusters with built-in nginx-ingress
# helm upgrade --install moda ./helm/moda -f values-rancher-examples.yaml --set scenario=rancher-local

# fastmoda:
#   enabled: true
#   service:
#     type: ClusterIP
#     port: 5000
#
# ingress:
#   enabled: true
#   className: nginx
#   annotations:
#     kubernetes.io/ingress.class: nginx
#     rancher.io/ingress: "true"
#     nginx.ingress.kubernetes.io/rewrite-target: /
#   hosts:
#     - host: moda.local
#       paths:
#         - path: /api
#           pathType: Prefix
#           backend: fastmoda
#         - path: /
#           pathType: Prefix
#           backend: mobile
#   tls: []

