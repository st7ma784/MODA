# ============================================================
# Installation Instructions by Provider
# ============================================================

# RANCHER LOCAL (Recommended):
# 1. Deploy to Rancher local cluster
# 2. helm upgrade --install moda ./helm/moda \
#    --namespace moda \
#    --create-namespace
# 3. Access via: https://<rancher-ip>/api/v1/namespaces/moda/services/http:moda-fastmoda:5000/proxy/

# AWS EKS:
# 1. aws eks update-kubeconfig --name my-cluster
# 2. helm upgrade --install moda ./helm/moda \
#    --namespace moda \
#    --create-namespace \
#    --set fastmoda.service.type=LoadBalancer
# 3. kubectl get svc -n moda  # Get LoadBalancer IP

# AZURE AKS:
# 1. az aks get-credentials --resource-group mygroup --name myaks
# 2. helm upgrade --install moda ./helm/moda \
#    --namespace moda \
#    --create-namespace
# 3. kubectl get svc -n moda

# GKE:
# 1. gke-gcloud-auth-plugin configured
# 2. helm upgrade --install moda ./helm/moda \
#    --namespace moda \
#    --create-namespace
# 3. gcloud compute addresses create moda-ip --global
# 4. kubectl get ingress -n moda

# ON-PREM (MetalLB):
# 1. Install MetalLB: helm install metallb metallb/metallb
# 2. Configure MetalLB IP pool
# 3. helm upgrade --install moda ./helm/moda \
#    --namespace moda \
#    --create-namespace
# 4. kubectl get svc -n moda  # Get MetalLB IP

# ============================================================
# Port Numbers Reference
# ============================================================
#
# FastMODA API:     5000 (HTTP)
# MODA Server:      6789 (gRPC/TCP)
# Mobile UI:        80 (HTTP)
# Ingress:          80 (HTTP), 443 (HTTPS)
#
# All ports can be customized in values.yaml
