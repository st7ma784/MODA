defaultNamespace: moda

helm:
  chart: ./helm/moda
  releaseName: moda
  values:
    ingress:
      hosts:
        - host: "{{ index .ClusterLabels \"hostname\" }}"
          paths:
            - path: /moda(/|$)(.*)
              pathType: ImplementationSpecific
              backend: fastmoda

# Restrict Fleet to only the helm chart directory, preventing it from
# bundling large binary files (example_sigs/, User Manual.pdf, etc.)
# that would exceed Rancher's 3MB API request limit.
ignore:
  conditions:
    - path: example_sigs
    - path: allguis
    - path: APP
    - path: FastMODA
    - path: docs
    - path: scripts
    - path: tests
    - path: __pycache__
    - path: "User Manual.pdf"
    - path: "*.mat"
    - path: "*.fig"
    - path: "*.pdf"
    - path: "*.pyc"
    - path: "*.pyo"
    - path: emulator.py
    - path: signal_generator.py
    - path: MODA.m
    - path: "docker-compose*.yml"
    - path: "Dockerfile*"
    - path: "*.sh"
