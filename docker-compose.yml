services:
  redis:
    image: redis:7-alpine
    container_name: moda-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  fastmoda:
    build:
      context: ./FastMODA
      dockerfile: Dockerfile
      target: base
    image: moda-fastmoda:local
    container_name: moda-fastmoda
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - FLASK_DEBUG=false
      - GUNICORN_WORKERS=2
      - REDIS_URL=redis://redis:6379/0
      - MODA_DATA_DIR=/app/data
    ports:
      - "5000:5000"
    volumes:
      - moda-uploads:/app/uploads
      - moda-data:/app/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  moda-uploads:
  moda-data:
