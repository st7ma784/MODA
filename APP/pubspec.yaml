name: moda_mobile
description: MODA Signal Analysis — BLE sensor data acquisition and analysis
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # BLE
  flutter_blue_plus: ^1.31.0
  permission_handler: ^11.3.0

  # Charts
  fl_chart: ^0.68.0

  # HTTP / API
  dio: ^5.4.0

  # State
  provider: ^6.1.2

  # Storage
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  flutter_secure_storage: ^9.0.0

  # Export / share
  share_plus: ^10.0.0

  # File import (for loading 2nd channel signal files)
  file_picker: ^8.1.2

  # Microphone capture (built-in / USB-C mic as a signal source)
  record: ^5.1.2

  # Plot rendering (Plotly.js figures from FastMODA backend)
  webview_flutter: ^4.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# record 5.x caps record_linux at <1.0.0, pinning the stale 0.7.2 desktop impl
# that predates record_platform_interface 1.6.0 (no startStream/named hasPermission)
# and breaks the federated compile. record_linux 1.3.1 implements the new interface;
# it only runs on Linux desktop, never on the Android/iOS targets we ship.
dependency_overrides:
  record_linux: ^1.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/moda_logo.png
    - assets/plotly/
